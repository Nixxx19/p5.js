<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>tangent bench: screen-space</title>
<script src="https://cdn.jsdelivr.net/gh/Nixxx19/p5.js@2635121e4/bench/p5.screenspace.min.js" charset="utf-8"></script>
<style>body{margin:0;background:#111;color:#eee;font:14px/1.4 monospace}
#hud{position:fixed;top:10px;left:10px;background:rgba(0,0,0,.6);padding:8px 12px;border-radius:6px}
#fps{font-size:22px;font-weight:bold}</style>
</head>
<body>
<div id="hud"><div>screen-space tangents (dFdx/dFdy, no per-vertex data)</div><div id="fps">loading model...</div></div>
<script>
const MODEL = 'https://cdn.jsdelivr.net/gh/Nixxx19/p5.js@2635121e4/bench/bump_sphere.obj';
let sphereModel, gl, frameMs = 0;
async function setup() {
  createCanvas(1000, 1000, WEBGL);
  pixelDensity(1);
  sphereModel = await loadModel(MODEL); // obj is already unit sized (±1)
}
function draw() {
  if (!sphereModel) return;
  const cnv = document.querySelector('canvas');
  if (!gl) gl = cnv.getContext('webgl2') || cnv.getContext('webgl');
  const t0 = performance.now();
  background(12, 14, 22);
  ambientLight(38, 40, 55);
  pointLight(255, 190, 140, -350, -260, 450); // warm key, upper left
  pointLight(120, 170, 255, 360, 260, 260);   // cool rim, lower right
  noStroke();
  fill(228, 220, 210);
  specularMaterial(255);
  shininess(90);
  // fixed grid facing the camera; each sphere spins in place so the bump
  // detail animates but nothing swings toward the camera. big overlapping
  // spheres keep it fragment heavy so it's gpu bound (where the tangent cost shows).
  const N = 13, gap = 74, s = 62;
  for (let i = 0; i < N; i++) for (let j = 0; j < N; j++) {
    push();
    translate((i-(N-1)/2)*gap, (j-(N-1)/2)*gap, 0);
    rotateX(frameCount*0.012 + i);
    rotateY(frameCount*0.015 + j);
    scale(s);
    model(sphereModel);
    pop();
  }
  // force the gpu to finish so we time real render cost, not vsync wait.
  // this is the number to compare between the two pages (lower = faster).
  gl.finish();
  const dt = performance.now() - t0;
  frameMs = frameMs ? frameMs * 0.9 + dt * 0.1 : dt;
  document.getElementById('fps').textContent =
    frameMs.toFixed(1) + ' ms/frame  (' + (1000 / frameMs).toFixed(0) + ' fps uncapped)';
}
</script>
</body>
</html>
